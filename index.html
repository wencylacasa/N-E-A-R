<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"/>
<title>NEAR — Live POI Explorer</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #060912;
    --surface: rgba(10,14,22,0.96);
    --surface2: rgba(20,26,38,0.9);
    --border: rgba(255,255,255,0.08);
    --text: #e2e8f4;
    --muted: #4a5878;
    --accent: #5eead4;
    --accent2: #818cf8;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; font-family:'Space Grotesk',sans-serif; background:var(--bg); color:var(--text); touch-action:manipulation; }
  
  #map { position:fixed; inset:0; }
  .mapboxgl-canvas { will-change:transform; }

  /* ── HEADER ── */
  #header {
    position:fixed; top:0; left:0; right:0; z-index:200;
    padding:16px;
    background:linear-gradient(180deg,rgba(6,9,18,0.98) 0%,rgba(6,9,18,0.85) 60%,transparent 100%);
    pointer-events:none;
  }
  #header-inner { display:flex; align-items:center; gap:14px; pointer-events:all; }

  .wordmark {
    font-family:'Space Mono',monospace; font-weight:700; font-size:22px;
    letter-spacing:0.18em; color:var(--accent); flex-shrink:0;
    text-shadow:0 0 20px rgba(94,234,212,0.5);
  }

  #search-wrap { flex:1; position:relative; }
  #search-input {
    width:100%; background:rgba(10,14,22,0.7); border:1px solid rgba(255,255,255,0.1);
    border-radius:24px; padding:16px 48px 16px 20px; height:56px;
    font-size:17px; font-weight:500; color:var(--text);
    outline:none; transition:border-color 0.2s, box-shadow 0.2s;
    backdrop-filter:blur(30px) saturate(200%); box-shadow:0 8px 30px rgba(0,0,0,0.4);
  }
  #search-input::placeholder { color:var(--muted); }
  #search-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(94,234,212,0.1); }
  .search-icon { position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }

  #ac-list {
    display:none; position:absolute; top:calc(100% + 8px); left:0; right:0;
    background:rgba(10,14,22,0.98); border:1px solid var(--border); border-radius:16px;
    overflow:hidden; z-index:300; box-shadow:0 20px 60px rgba(0,0,0,0.7);
    backdrop-filter:blur(20px);
  }
  .ac-item {
    padding:14px 16px; cursor:pointer;
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:12px; transition:background 0.12s;
  }
  .ac-item:last-child { border-bottom:none; }
  .ac-item:hover, .ac-item:active { background:var(--surface2); }
  .ac-name { font-weight:600; font-size:15px; }
  .ac-place { font-size:12px; color:var(--muted); font-family:'Space Mono',monospace; margin-top:2px; }

  /* ── LOCATE BTN ── */
  #locate-btn {
    position:fixed; top:76px; right:16px; z-index:190;
    width:48px; height:48px; border-radius:14px;
    background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all 0.2s; backdrop-filter:blur(20px);
    color:var(--accent); box-shadow:0 8px 24px rgba(0,0,0,0.5);
  }
  #locate-btn:hover { background:var(--surface2); transform:scale(1.05); }
  #locate-btn:active { transform:scale(0.95); }
  #locate-btn.pulsing { animation:locatePulse 1s ease-in-out infinite; }
  @keyframes locatePulse { 0%,100%{box-shadow:0 0 0 0 rgba(94,234,212,0.4)} 50%{box-shadow:0 0 0 10px rgba(94,234,212,0)} }

  /* ── BOTTOM SHEET ── */
  #sheet {
    position:fixed; bottom:0; left:0; right:0; z-index:180;
    max-height:88vh; display:flex; flex-direction:column;
    background:rgba(20,26,38,0.75); border-top:1px solid rgba(255,255,255,0.15);
    border-radius:40px 40px 0 0; backdrop-filter:blur(50px) saturate(200%);
    transform:translateY(calc(100% - 180px));
    transition:transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    will-change:transform; padding-top:8px;
    box-shadow: 0 -20px 50px rgba(0,0,0,0.5);
  }
  #sheet.expanded { transform:translateY(0); }
  #sheet.peek { transform:translateY(calc(100% - 190px)); }
  #sheet.collapsed { transform:translateY(calc(100% - 70px)); }

  .sheet-handle {
    width:64px; height:5px; background:rgba(255,255,255,0.2); border-radius:3px;
    margin:12px auto 0; flex-shrink:0; cursor:grab;
  }

  /* Filter pills */
  #filter-bar {
    padding:16px 20px 0; flex-shrink:0;
    display:flex; align-items:center; gap:12px; overflow-x:auto;
    scrollbar-width:none; -ms-overflow-style:none;
    -webkit-overflow-scrolling:touch; margin-bottom:4px;
  }
  #filter-bar::-webkit-scrollbar { display:none; }

  .cat-pill {
    display:flex; align-items:center; gap:8px; padding:14px 24px;
    border-radius:24px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1);
    color:var(--text); font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:600;
    cursor:pointer; transition:all 0.3s cubic-bezier(0.2,0.8,0.2,1); white-space:nowrap; flex-shrink:0;
    box-shadow:0 4px 16px rgba(0,0,0,0.15);
  }
  .cat-pill .pill-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .cat-pill .pill-icon { width:16px; height:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .cat-pill .pill-icon svg { width:16px; height:16px; }
  .cat-pill .pill-cnt { font-family:'Space Mono',monospace; font-size:11px; opacity:0.6; transition:opacity 0.2s; }
  
  .cat-pill.active { 
    background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.15); 
    box-shadow:0 8px 24px rgba(0,0,0,0.25); transform:translateY(-2px);
  }
  .cat-pill.active .pill-cnt { opacity: 0.9; }
  .cat-pill.off { opacity:0.4; transform:scale(0.96); box-shadow:none; }
  .cat-pill:active { transform:scale(0.92); }

  /* Detail area */
  #detail-area { padding:16px 16px 10px; flex-shrink:0; }
  #detail-badge {
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.12em;
    padding:4px 10px; border-radius:6px; margin-bottom:8px;
    background:rgba(255,255,255,0.06); font-weight:700;
  }
  #detail-name { font-size:20px; font-weight:700; line-height:1.2; margin-bottom:4px; }
  #detail-addr { font-size:13px; color:var(--muted); font-family:'Space Mono',monospace; line-height:1.4; }

  /* Nearby list */
  .nearby-head {
    padding:10px 16px 4px; font-family:'Space Mono',monospace;
    font-size:10px; letter-spacing:0.14em; color:var(--muted); flex-shrink:0;
    display:flex; align-items:center; gap:8px;
  }
  #nearby-list { flex:1; overflow-y:auto; padding:0 12px 80px; -webkit-overflow-scrolling:touch; }
  
  .nearby-item {
    display:flex; align-items:center; gap:14px; padding:16px;
    border-radius:20px; cursor:pointer; transition:all 0.2s;
    background:rgba(20,26,38,0.4); margin-bottom:10px;
    border:1px solid transparent;
  }
  .nearby-item:active { background:var(--surface2); transform:scale(0.98); }
  .nearby-item:hover { border-color:rgba(255,255,255,0.05); }
  .ni-pip { width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  .ni-info { flex:1; min-width:0; }
  .ni-name { font-size:17px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ni-sub  { font-size:12px; font-family:'Space Mono',monospace; color:var(--muted); margin-top:4px; display:flex; align-items:center; gap:6px; }
  .ni-sub-icon { width:14px; height:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .ni-sub-icon svg { width:14px; height:14px; }
  .ni-dist { font-size:14px; font-family:'Space Mono',monospace; color:var(--accent); white-space:nowrap; flex-shrink:0; font-weight:700; }
  .ni-nearest-badge {
    font-size:9px; font-family:'Space Mono',monospace; letter-spacing:0.1em;
    padding:2px 6px; border-radius:4px; background:rgba(94,234,212,0.12);
    color:var(--accent); white-space:nowrap;
  }

  /* ── MOBILE POI MODAL ── */
  #poi-modal {
    position:fixed; bottom:0; left:0; right:0; z-index:400;
    background:rgba(10,14,22,0.97); border-top:1px solid rgba(255,255,255,0.12);
    border-radius:28px 28px 0 0; backdrop-filter:blur(40px) saturate(200%);
    transform:translateY(100%);
    transition:transform 0.42s cubic-bezier(0.25,1,0.5,1);
    padding:0 0 env(safe-area-inset-bottom,0);
    box-shadow:0 -30px 80px rgba(0,0,0,0.7);
  }
  #poi-modal.open { transform:translateY(0); }
  .modal-handle { width:48px; height:5px; background:rgba(255,255,255,0.18); border-radius:3px; margin:14px auto 0; }
  .modal-inner { padding:20px 20px 28px; }
  .modal-cat-row {
    display:flex; align-items:center; gap:8px; margin-bottom:10px;
    font-family:'Space Mono',monospace; font-size:11px; font-weight:700; letter-spacing:0.1em;
  }
  .modal-cat-icon { width:18px; height:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .modal-cat-icon svg { width:18px; height:18px; }
  .modal-name { font-size:22px; font-weight:700; line-height:1.2; margin-bottom:6px; }
  .modal-addr { font-size:13px; color:var(--muted); font-family:'Space Mono',monospace; line-height:1.5; margin-bottom:20px; }
  .modal-meta { display:flex; gap:10px; margin-bottom:20px; }
  .modal-meta-chip {
    display:flex; align-items:center; gap:6px; padding:8px 14px;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
    border-radius:12px; font-size:13px; font-weight:600;
    font-family:'Space Mono',monospace;
  }
  .modal-actions { display:flex; gap:12px; }
  .modal-btn-primary {
    flex:1; padding:16px; background:var(--accent); border:none; border-radius:16px;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;
    color:#000; cursor:pointer; letter-spacing:0.03em;
    transition:transform 0.1s, opacity 0.15s; -webkit-tap-highlight-color:transparent;
  }
  .modal-btn-primary:active { transform:scale(0.96); opacity:0.85; }
  .modal-btn-sec {
    padding:16px 20px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1);
    border-radius:16px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;
    color:var(--text); cursor:pointer; transition:transform 0.1s; -webkit-tap-highlight-color:transparent;
  }
  .modal-btn-sec:active { transform:scale(0.96); }

  /* Dismiss overlay */
  #modal-overlay {
    position:fixed; inset:0; z-index:390;
    background:rgba(0,0,0,0.4); opacity:0;
    pointer-events:none; transition:opacity 0.3s;
  }
  #modal-overlay.active { opacity:1; pointer-events:all; }

  /* ── MAPBOX overrides ── */
  .mapboxgl-ctrl-group { background:var(--surface)!important; border:1px solid var(--border)!important; border-radius:12px!important; backdrop-filter:blur(20px)!important; }
  .mapboxgl-ctrl-icon { filter:invert(0.8) brightness(0.6); }
  .mapboxgl-ctrl-top-left { top:134px!important; left:16px!important; }
  .mapboxgl-ctrl-attrib, .mapboxgl-ctrl-logo { display:none!important; }

  /* ── MARKERS ── */
  .mk-user {
    width:20px; height:20px; border-radius:50%; background:var(--accent);
    border:3px solid #fff; box-shadow:0 0 0 8px rgba(94,234,212,0.2);
    position:relative; z-index:10;
  }
  .mk-user-ring {
    position:absolute; width:60px; height:60px;
    border-radius:50%; background:rgba(94,234,212,0.12);
    top:50%; left:50%; transform:translate(-50%,-50%);
    animation:userRipple 2s ease-out infinite;
    pointer-events:none;
  }
  @keyframes userRipple {
    0% { transform:translate(-50%,-50%) scale(0.5); opacity:1; }
    100% { transform:translate(-50%,-50%) scale(2); opacity:0; }
  }

  /* FIX: Explicit marker sizing so icons always render */
  .mk-poi {
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative;
    transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s, opacity 0.4s;
    will-change:transform;
    transform: scale(1);
    flex-shrink:0;
  }
  /* FIX: SVG inside marker — always 18x18 px, never inherits parent size */
  .mk-poi svg {
    width:18px !important;
    height:18px !important;
    display:block;
    pointer-events:none;
    flex-shrink:0;
  }
  .mk-poi.distant { transform:scale(0.62); opacity:0.8; z-index:1; }
  .mk-poi:hover { transform:scale(1.18); z-index:5; opacity:1; box-shadow:0 8px 24px rgba(0,0,0,0.4); }
  .mk-poi.selected { transform:scale(1.35); z-index:20; opacity:1; box-shadow:0 12px 30px rgba(0,0,0,0.5); }
  .mk-poi.nearest::after {
    content:''; position:absolute; inset:-5px;
    border-radius:50%; border:2px solid currentColor;
    animation:nearestPulse 2.5s ease-in-out infinite;
    opacity:0.6; pointer-events:none;
  }
  @keyframes nearestPulse {
    0%,100% { transform:scale(1); opacity:0.8; }
    50% { transform:scale(1.3); opacity:0; }
  }
  .mk-poi.ping-pop::before {
    content:''; position:absolute; inset:-4px;
    border-radius:50%; background:currentColor;
    animation:pingPopAnim 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
    pointer-events:none; z-index:-1;
  }
  @keyframes pingPopAnim {
    0% { transform:scale(0.8); opacity:0.9; }
    100% { transform:scale(2.5); opacity:0; }
  }

  /* ── LOADING ── */
  #loading {
    position:fixed; inset:0; z-index:500;
    background:rgba(6,9,18,0.6); backdrop-filter:blur(40px) saturate(200%);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:24px;
    transition:opacity 0.6s, visibility 0.6s;
  }
  #loading.hidden { opacity:0; visibility:hidden; }
  .load-app-icon {
    width:72px; height:72px; border-radius:20px; background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.08);
  }
  .load-wordmark { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:24px; letter-spacing:0.15em; color:#fff; }
  .load-bar-wrap { width:220px; height:4px; background:rgba(255,255,255,0.1); border-radius:4px; overflow:hidden; }
  .load-bar { height:100%; width:0%; background:#fff; border-radius:4px; transition:width 0.5s cubic-bezier(0.2,0.8,0.2,1); }
  .load-text { font-family:'Space Grotesk',sans-serif; font-size:13px; color:rgba(255,255,255,0.7); font-weight:500; letter-spacing:0.02em; }

  /* ── TOAST ── */
  #toast {
    position:fixed; bottom:200px; left:50%; z-index:600;
    transform:translateX(-50%) translateY(10px);
    background:rgba(10,14,22,0.95); color:var(--text);
    padding:10px 22px; border-radius:24px;
    font-size:14px; font-weight:600; letter-spacing:0.04em;
    border:1px solid var(--border);
    opacity:0; transition:all 0.3s; pointer-events:none; white-space:nowrap;
    backdrop-filter:blur(16px); box-shadow:0 12px 40px rgba(0,0,0,0.6);
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ── DESKTOP ── */
  @media (min-width: 768px) {
    #sheet {
      top:64px; bottom:0; left:auto; right:0; width:340px; max-height:none;
      border-radius:0; border-top:none; border-left:1px solid var(--border);
      transform:translateX(0) !important;
      transition:none; padding-top:0;
    }
    #sheet.expanded, #sheet.peek, #sheet.collapsed { transform:translateX(0)!important; }
    .sheet-handle { display:none; }
    #filter-bar { flex-wrap:wrap; padding:16px 16px 0; }
    .cat-pill { padding:8px 14px; }
    #nearby-list { padding-bottom:20px; }
    #locate-btn { top:76px; }
    #toast { bottom:60px; }
    /* On desktop use the old popup style, hide mobile modal */
    #poi-modal { display:none; }
    #modal-overlay { display:none; }
    .mapboxgl-popup-content {
      background:rgba(10,14,22,0.98)!important; border:1px solid var(--border)!important;
      border-radius:16px!important; padding:16px!important;
      color:var(--text)!important; font-family:'Space Grotesk',sans-serif!important;
      box-shadow:0 20px 50px rgba(0,0,0,0.8)!important; min-width:200px;
      backdrop-filter:blur(20px)!important;
    }
    .mapboxgl-popup-tip { display:none!important; }
    .pu-name { font-size:17px; font-weight:700; margin-bottom:4px; }
    .pu-cat  { font-size:12px; font-family:'Space Mono',monospace; letter-spacing:0.08em; margin-bottom:6px; font-weight:700; display:flex; align-items:center; gap:6px; }
    .pu-cat svg { width:14px; height:14px; }
    .pu-addr { font-size:13px; color:var(--muted); margin-bottom:14px; line-height:1.4; }
    .pu-row  { display:flex; gap:10px; }
    .pu-btn  {
      flex:1; padding:12px; background:var(--accent);
      border:none; border-radius:12px; font-family:'Space Grotesk',sans-serif;
      font-weight:700; font-size:14px; color:#000; cursor:pointer;
      letter-spacing:0.04em; transition:transform 0.1s;
    }
    .pu-btn:active { transform:scale(0.96); }
    .pu-btn-sec {
      padding:12px; background:var(--surface2); border:1px solid var(--border);
      border-radius:12px; font-family:'Space Grotesk',sans-serif;
      font-weight:600; font-size:14px; color:var(--text); cursor:pointer;
    }
  }

  /* Center Dot */
  #center-dot {
    position:fixed; top:50%; left:50%; z-index:150;
    width:14px; height:14px; border-radius:50%;
    background:transparent; border:3px solid rgba(255,255,255,0.4);
    transform:translate(-50%,-50%);
    pointer-events:none; transition:border-color 0.2s;
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="center-dot"></div>

<div id="loading">
  <div class="load-app-icon">
    <svg width="36" height="36" fill="none" stroke="url(#g-load)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <defs><linearGradient id="g-load" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5eead4"/><stop offset="100%" stop-color="#818cf8"/></linearGradient></defs>
      <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/>
    </svg>
  </div>
  <div class="load-wordmark">NEAR</div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-text" id="load-text">Initializing…</div>
</div>

<header id="header">
  <div id="header-inner">
    <div class="wordmark">NEAR</div>
    <div id="search-wrap">
      <input id="search-input" type="text" placeholder="Search place or address…" autocomplete="off" inputmode="search"/>
      <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <div id="ac-list"></div>
    </div>
  </div>
</header>

<button id="locate-btn" title="Use my location">
  <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3"/>
    <path d="M12 2v2m0 16v2M2 12h2m16 0h2"/>
    <circle cx="12" cy="12" r="8" stroke-opacity="0.3"/>
  </svg>
</button>

<div id="sheet">
  <div class="sheet-handle" id="sheet-handle"></div>

  <div id="filter-bar"></div>

  <div id="detail-area">
    <div id="detail-badge">TAP A MARKER</div>
    <div id="detail-name">NEAR you</div>
    <div id="detail-addr">Showing nearest per category</div>
  </div>

  <div class="nearby-head">
    <span>// NEARBY</span>
    <span id="nearby-count" style="color:var(--accent);font-size:10px;"></span>
  </div>
  <div id="nearby-list">
    <div style="padding:30px 20px;text-align:center;color:var(--muted);font-size:13px;font-family:'Space Mono',monospace;">Searching nearby…</div>
  </div>
</div>

<!-- Mobile POI Modal -->
<div id="modal-overlay" onclick="closeModal()"></div>

<div id="toast"></div>

<script>
const TOKEN = 'pk.eyJ1IjoidGFsa2luZ3JpdmVycyIsImEiOiJjbW13MThuZXQycTdqMndwc3FyM3lzOWc3In0.Gg_QTjih_OS0BVk1oT7Kwg';
mapboxgl.accessToken = TOKEN;

const isMobile = () => window.innerWidth < 768;

// ── ICONS (self-contained SVG strings, no size attributes — CSS controls size) ──
function makeIcon(path) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
}

const ICONS = {
  mall:     makeIcon('<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>'),
  hospital: makeIcon('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8m-4-4h8"/>'),
  school:   makeIcon('<path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>'),
  transit:  makeIcon('<rect x="4" y="3" width="16" height="14" rx="2"/><path d="M4 11h16M12 3v8M8 17l-2 4m10-4 2 4M7 17h10"/>'),
  food:     makeIcon('<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/>'),
  park:     makeIcon('<path d="M12 22V12M12 12C12 12 7 10 7 6a5 5 0 0 1 10 0c0 4-5 6-5 6z"/><path d="M5 22h14"/>'),
};

const CATS = {
  mall:     { label:'Mall',      color:'#f472b6', query:'shopping_mall',   icon:ICONS.mall },
  hospital: { label:'Hospital',  color:'#34d399', query:'hospital',        icon:ICONS.hospital },
  school:   { label:'School',    color:'#fbbf24', query:'school',          icon:ICONS.school },
  transit:  { label:'Transport', color:'#818cf8', query:'transit_station', icon:ICONS.transit },
  food:     { label:'Food',      color:'#fb923c', query:'restaurant',      icon:ICONS.food },
  park:     { label:'Park',      color:'#86efac', query:'park',            icon:ICONS.park },
};

// ── STATE ──
let map, popup;
let userLoc = null, userMarker = null;
let poiMarkers = {}, allPOI = [];
let activeCats = new Set(Object.keys(CATS));
let selectedPOI = null;
let acTimer = null;
let nearestPerCat = {};
let isDragging = false;
let sheetState = 'peek';
let touchStartX = null, touchStartY = null, touchStartTime = null, sheetStartY = null;
let isDraggingSheet = false, dragLocked = false;
let routeFetchQueue = {};
let modalPOI = null;

// ── MAP INIT ──
function init() {
  map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/dark-v11',
    center: [121.02, 14.59],
    zoom: 13,
    pitch: 0,
    fadeDuration: 0,
    antialias: true,
    performanceMetricsCollection: false,
  });

  map.getCanvas().addEventListener('contextmenu', e => e.preventDefault());
  map.dragRotate.disable();
  map.touchZoomRotate.disableRotation();
  map.addControl(new mapboxgl.NavigationControl({ showCompass:false }), 'top-left');

  popup = new mapboxgl.Popup({ closeButton:false, offset:22, maxWidth:'260px', anchor:'bottom' });

  map.on('click', e => {
    if (isDragging) return;
    const features = map.queryRenderedFeatures(e.point);
    if (!features.some(f => f.layer.id.includes('poi'))) {
      setCenter({ lng: e.lngLat.lng, lat: e.lngLat.lat }, true);
      popup.remove();
      closeModal();
    }
  });

  map.on('dragstart', () => { isDragging = true; popup.remove(); });
  map.on('dragend',   () => { setTimeout(() => isDragging = false, 150); });

  map.on('load', () => {
    map.addSource('routes', { type:'geojson', data:emptyFC() });
    map.addLayer({ id:'routes-glow-wide', type:'line', source:'routes',
      layout:{ 'line-join':'round','line-cap':'round' },
      paint:{ 'line-color':['get','color'], 'line-width':14, 'line-opacity':0.08, 'line-blur':8 }
    });
    map.addLayer({ id:'routes-glow', type:'line', source:'routes',
      layout:{ 'line-join':'round','line-cap':'round' },
      paint:{ 'line-color':['get','color'], 'line-width':6, 'line-opacity':0.25, 'line-blur':4 }
    });
    map.addLayer({ id:'routes-core', type:'line', source:'routes',
      layout:{ 'line-join':'round','line-cap':'round' },
      paint:{ 'line-color':['get','color'], 'line-width':3, 'line-opacity':0.9 }
    });

    map.addSource('routes-dots', { type:'geojson', data:emptyFC() });
    map.addLayer({
      id: 'routes-dots-glow', type: 'circle', source: 'routes-dots',
      paint: { 'circle-radius': 14, 'circle-color': ['get', 'color'], 'circle-opacity': 0.45, 'circle-blur': 1 }
    });
    map.addLayer({
      id: 'routes-dots-core', type: 'circle', source: 'routes-dots',
      paint: { 'circle-radius': 4, 'circle-color': '#ffffff', 'circle-opacity': 1, 'circle-stroke-width': 1.5, 'circle-stroke-color': ['get', 'color'] }
    });

    buildFilters();
    setLoadProgress(40, 'Getting location…');
    geolocate();
  });
}

// ── ROUTE ANIMATION ──
let routeAnimation;
function animateRoutes(lineFeatures) {
  cancelAnimationFrame(routeAnimation);
  let hasPinged = false;

  const lines = lineFeatures.map(f => {
    const coords = f.geometry.coordinates;
    let dists = [0], total = 0;
    for(let i=1; i<coords.length; i++) {
      const dx=coords[i][0]-coords[i-1][0], dy=coords[i][1]-coords[i-1][1];
      total += Math.sqrt(dx*dx+dy*dy);
      dists.push(total);
    }
    return { coords, dists, totalLength:total, color:f.properties.color, id:f.properties.id };
  }).filter(l => l.totalLength > 0);

  let progress = 0, startTime = null;
  const animDuration = 1800;

  function updateFrame(time) {
    if (!startTime) startTime = time;
    const elapsed = time - startTime;

    if (!isDragging && lines.length > 0 && progress <= 1) {
      let t = Math.min(elapsed / animDuration, 1);
      progress = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;

      if (progress >= 0.99 && !hasPinged) {
        hasPinged = true;
        lines.forEach(line => {
          if (line.id && poiMarkers[line.id]) {
            const el = poiMarkers[line.id].el;
            el.classList.add('ping-pop');
            setTimeout(() => el.classList.remove('ping-pop'), 600);
          }
        });
      }

      const dotFeatures = [], drawnLines = [];
      lines.forEach(line => {
        const targetDist = progress * line.totalLength;
        let i = 0;
        while(i < line.dists.length-2 && line.dists[i+1] < targetDist) i++;
        const p1=line.coords[i], p2=line.coords[i+1];
        if (!p1||!p2) return;
        const segLen = line.dists[i+1]-line.dists[i];
        const w = segLen===0?0:(targetDist-line.dists[i])/segLen;
        const lng=p1[0]+(p2[0]-p1[0])*w, lat=p1[1]+(p2[1]-p1[1])*w;
        dotFeatures.push({ type:'Feature', properties:{color:line.color}, geometry:{type:'Point',coordinates:[lng,lat]} });
        const drawnCoords = [...line.coords.slice(0,i+1), [lng,lat]];
        drawnLines.push({ type:'Feature', properties:{color:line.color,id:line.id}, geometry:{type:'LineString',coordinates:drawnCoords} });
      });

      map.getSource('routes')?.setData({type:'FeatureCollection',features:drawnLines});
      map.getSource('routes-dots')?.setData({type:'FeatureCollection',features:dotFeatures});
    }
    if (progress < 1) routeAnimation = requestAnimationFrame(updateFrame);
  }
  routeAnimation = requestAnimationFrame(updateFrame);
}

// ── GEOLOCATE ──
function geolocate() {
  if (!navigator.geolocation) { hideLoading(); toast('Geolocation unavailable'); return; }
  const btn = document.getElementById('locate-btn');
  btn.classList.add('pulsing');
  navigator.geolocation.getCurrentPosition(
    p => {
      btn.classList.remove('pulsing');
      setCenter({ lng:p.coords.longitude, lat:p.coords.latitude }, true);
    },
    () => {
      btn.classList.remove('pulsing');
      hideLoading();
      toast('Location denied — tap map to set location');
    },
    { timeout:10000, enableHighAccuracy:true }
  );
}

function setCenter(lngLat, fly) {
  userLoc = lngLat;
  closeModal();

  if (userMarker) userMarker.remove();
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative;width:20px;height:20px;';
  const ring = document.createElement('div'); ring.className='mk-user-ring';
  const dot  = document.createElement('div'); dot.className='mk-user';
  wrap.appendChild(ring); wrap.appendChild(dot);
  userMarker = new mapboxgl.Marker({element:wrap,anchor:'center'})
    .setLngLat([lngLat.lng,lngLat.lat]).addTo(map);

  if (fly) {
    const isDesktop = !isMobile();
    map.flyTo({
      center:[lngLat.lng,lngLat.lat], zoom:14,
      padding:{ bottom:isDesktop?0:250, right:isDesktop?340:0 },
      duration:1200,
      easing:t=>t<0.5?2*t*t:(-1+(4-2*t)*t),
      essential:true
    });
  }

  clearMarkers(); clearRoutes();
  selectedPOI=null; nearestPerCat={};
  resetDetail();
  fetchAll(lngLat);
}

// ── FETCH ALL ──
function fitMapToBounds() {
  if (!userLoc) return;
  const bounds = new mapboxgl.LngLatBounds();
  bounds.extend([userLoc.lng,userLoc.lat]);
  let added = false;
  Object.entries(poiMarkers).forEach(([id,{el,wrap}]) => {
    if (wrap&&wrap.style.display!=='none'&&!el.classList.contains('distant')) {
      const poi = allPOI.find(p=>p.id===id);
      if (poi) { bounds.extend([poi.lng,poi.lat]); added=true; }
    }
  });
  if (added) {
    const isDesktop = !isMobile();
    map.fitBounds(bounds, {
      padding:{ top:140, bottom:isDesktop?60:300, left:60, right:isDesktop?380:60 },
      maxZoom:15.5, duration:1600, pitch:0, essential:true
    });
  }
}

async function fetchAll(center) {
  setLoadProgress(50,'Searching nearby places…');
  showLoading();
  allPOI=[];
  await Promise.all(Object.keys(CATS).map(k => fetchCat(k,center)));
  findNearestPerCat();
  hideLoading();
  updateCounts();
  drawInitialRoutes();
  populateNearbyDefault();
  refreshVis();
  fitMapToBounds();
  toast(`Found ${allPOI.length} places nearby`);
}

async function fetchCat(catKey, center) {
  const q = encodeURIComponent(CATS[catKey].query);
  const url = `https://api.mapbox.com/search/searchbox/v1/category/${q}`
    + `?access_token=${TOKEN}&proximity=${center.lng},${center.lat}&limit=24&language=en`;
  try {
    const r = await fetch(url);
    if (!r.ok) return;
    const d = await r.json();
    (d.features||[]).forEach(f => {
      const [lng,lat] = f.geometry.coordinates;
      const poi = {
        id: catKey+'_'+(f.properties.mapbox_id||Math.random().toString(36).slice(2)),
        catKey, name:f.properties.name||'Unknown',
        address:f.properties.full_address||f.properties.place_formatted||'',
        lng, lat, dist:haversine(center,{lng,lat}),
      };
      allPOI.push(poi);
      addMarker(poi);
    });
    setLoadProgress(50+Object.keys(CATS).indexOf(catKey)*8,`Loading ${CATS[catKey].label}…`);
  } catch(e) { console.warn(catKey,e); }
}

function findNearestPerCat() {
  nearestPerCat={};
  Object.keys(CATS).forEach(k => {
    const sorted = allPOI.filter(p=>p.catKey===k).sort((a,b)=>a.dist-b.dist);
    if (sorted[0]) nearestPerCat[k]=sorted[0];
  });
  Object.values(nearestPerCat).forEach(poi => {
    if (poiMarkers[poi.id]) poiMarkers[poi.id].el.classList.add('nearest');
  });
}

// ── ROUTING ──
async function fetchRoute(from,to) {
  const key=`${from.lng},${from.lat}-${to.lng},${to.lat}`;
  if (routeFetchQueue[key]) return routeFetchQueue[key];
  const url = `https://api.mapbox.com/directions/v5/mapbox/driving/${from.lng},${from.lat};${to.lng},${to.lat}`
    + `?geometries=geojson&overview=full&steps=false&access_token=${TOKEN}`;
  const p = fetch(url).then(r=>r.json()).then(d=>d.routes?.[0]?.geometry||null).catch(()=>null);
  routeFetchQueue[key]=p;
  return p;
}

async function drawInitialRoutes() {
  if (!userLoc) return;
  const nearest = Object.values(nearestPerCat);
  const results = await Promise.all(nearest.map(async p => {
    const geo = await fetchRoute({lng:userLoc.lng,lat:userLoc.lat},{lng:p.lng,lat:p.lat});
    return {poi:p,geo};
  }));
  const features = results.map(({poi,geo}) => {
    const coords = geo?[...geo.coordinates,  [poi.lng,poi.lat]]:[[userLoc.lng,userLoc.lat],[poi.lng,poi.lat]];
    return { type:'Feature', properties:{color:CATS[poi.catKey].color,id:poi.id}, geometry:{type:'LineString',coordinates:coords} };
  });
  animateRoutes(features.filter(f=>f.geometry.type==='LineString'));
}

async function drawRoutesToPOI(from) {
  const visible = allPOI.filter(p=>p.id!==from.id&&activeCats.has(p.catKey));
  if (!visible.length) { clearRoutes(); return; }
  const nearby = [...visible].sort((a,b)=>(a.d||a.dist)-(b.d||b.dist)).slice(0,12);
  const results = await Promise.all(nearby.map(async p => {
    const geo = await fetchRoute({lng:from.lng,lat:from.lat},{lng:p.lng,lat:p.lat});
    return {poi:p,geo};
  }));
  const realFeatures = results.map(({poi,geo}) => {
    const coords = geo?[...geo.coordinates,[poi.lng,poi.lat]]:[[from.lng,from.lat],[poi.lng,poi.lat]];
    return { type:'Feature', properties:{color:CATS[poi.catKey].color,id:poi.id}, geometry:{type:'LineString',coordinates:coords} };
  });
  const farFeatures = visible.slice(12).map(p => ({
    type:'Feature', properties:{color:CATS[p.catKey].color,id:p.id},
    geometry:{type:'LineString',coordinates:[[from.lng,from.lat],[p.lng,p.lat]]}
  }));
  animateRoutes([...realFeatures,...farFeatures].filter(f=>f.geometry.type==='LineString'));
}

// ── MARKERS ──
function addMarker(poi) {
  const cat = CATS[poi.catKey];

  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative;width:40px;height:40px;flex-shrink:0;';

  const el = document.createElement('div');
  el.className = 'mk-poi';
  // FIX: explicit background, border, color on the element itself
  el.style.cssText = `
    background:${cat.color};
    color:#000;
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
    border:2.5px solid rgba(255,255,255,0.9);
    width:40px; height:40px;
  `;
  // FIX: insert icon with explicit container size
  const iconWrap = document.createElement('div');
  iconWrap.style.cssText = 'width:18px;height:18px;display:flex;align-items:center;justify-content:center;pointer-events:none;flex-shrink:0;';
  iconWrap.innerHTML = cat.icon;
  // Ensure inner SVG respects size
  const svgEl = iconWrap.querySelector('svg');
  if (svgEl) { svgEl.style.width='18px'; svgEl.style.height='18px'; svgEl.style.display='block'; }
  el.appendChild(iconWrap);
  wrap.appendChild(el);

  // Touch: show modal on mobile, popup on desktop
  let tStartX, tStartY, tMoved;
  el.addEventListener('touchstart', e => {
    tStartX=e.touches[0].clientX; tStartY=e.touches[0].clientY; tMoved=false;
  }, {passive:true});
  el.addEventListener('touchmove', e => {
    if (Math.abs(e.touches[0].clientX-tStartX)>8||Math.abs(e.touches[0].clientY-tStartY)>8) tMoved=true;
  }, {passive:true});
  el.addEventListener('touchend', e => {
    if (!tMoved) { e.stopPropagation(); e.preventDefault(); onMarkerTap(poi); }
  }, {passive:false});

  el.addEventListener('mouseenter', () => { if(!isDragging&&!isMobile()) showPopup(poi); });
  el.addEventListener('mouseleave', () => { if(selectedPOI?.id!==poi.id) popup.remove(); });
  el.addEventListener('click', e => { e.stopPropagation(); onMarkerTap(poi); });

  new mapboxgl.Marker({element:wrap,anchor:'center'})
    .setLngLat([poi.lng,poi.lat]).addTo(map);
  poiMarkers[poi.id] = { marker: new mapboxgl.Marker({element:wrap,anchor:'center'}), el, wrap };

  // Re-add properly
  poiMarkers[poi.id].marker.remove();
  const m2 = new mapboxgl.Marker({element:wrap,anchor:'center'}).setLngLat([poi.lng,poi.lat]).addTo(map);
  poiMarkers[poi.id].marker = m2;
}

// ── MARKER TAP: fly camera first, THEN show modal/popup ──
function onMarkerTap(poi) {
  // Always fly camera to marker with nice padding
  const isDesktop = !isMobile();
  map.flyTo({
    center: [poi.lng, poi.lat],
    zoom: Math.max(map.getZoom(), 15),
    padding: { bottom: isDesktop ? 0 : 360, right: isDesktop ? 360 : 0, top: 100, left: 40 },
    duration: 700,
    easing: t => t < 0.5 ? 2*t*t : (-1+(4-2*t)*t),
    essential: true
  });

  if (isMobile()) {
    openModal(poi);
  } else {
    showPopup(poi);
  }
}

// ── MOBILE MODAL ──
function openModal(poi) {
  const cat = CATS[poi.catKey];
  modalPOI = poi;

  const catRow = document.getElementById('modal-cat-row');
  catRow.style.color = cat.color;

  const iconEl = document.getElementById('modal-cat-icon');
  iconEl.innerHTML = cat.icon;
  const sv = iconEl.querySelector('svg');
  if (sv) { sv.style.width='18px'; sv.style.height='18px'; sv.style.stroke=cat.color; }

  document.getElementById('modal-cat-label').textContent = cat.label.toUpperCase();
  document.getElementById('modal-name').textContent = poi.name;
  document.getElementById('modal-addr').textContent = poi.address || 'No address available';

  const dist = fmt(poi.dist);
  document.getElementById('modal-meta').innerHTML = `
    <div class="modal-meta-chip" style="color:var(--accent);">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
      ${dist}
    </div>
    <div class="modal-meta-chip">
      <div style="width:9px;height:9px;border-radius:50%;background:${cat.color};flex-shrink:0;box-shadow:0 0 6px ${cat.color}80;"></div>
      ${cat.label}
    </div>
  `;

  document.getElementById('modal-focus-btn').onclick = () => {
    closeModal();
    select(poi);
  };

  document.getElementById('poi-modal').classList.add('open');
  document.getElementById('modal-overlay').classList.add('active');
}

function closeModal() {
  document.getElementById('poi-modal').classList.remove('open');
  document.getElementById('modal-overlay').classList.remove('active');
  modalPOI = null;
}

// swipe down to close modal
let modalTouchStart = 0;
document.getElementById('poi-modal').addEventListener('touchstart', e => {
  modalTouchStart = e.touches[0].clientY;
}, {passive:true});
document.getElementById('poi-modal').addEventListener('touchend', e => {
  if (e.changedTouches[0].clientY - modalTouchStart > 60) closeModal();
}, {passive:true});

// ── POPUP (desktop) ──
function showPopup(poi) {
  const cat = CATS[poi.catKey];
  const sk  = safeKey(poi.id);
  window['_p'+sk] = poi;
  popup.setLngLat([poi.lng,poi.lat]).setHTML(`
    <div class="pu-name">${esc(poi.name)}</div>
    <div class="pu-cat" style="color:${cat.color};">
      <span style="width:14px;height:14px;display:flex;">${cat.icon}</span>
      ${cat.label.toUpperCase()}
    </div>
    <div class="pu-addr">${esc(poi.address)||'—'}</div>
    <div class="pu-row">
      <button class="pu-btn" onclick="select(window['_p${sk}'])">Focus &amp; Route</button>
      <button class="pu-btn-sec" onclick="setCenter({lng:${poi.lng},lat:${poi.lat}},true)">Center Here</button>
    </div>
  `).addTo(map);
}

// ── ROUTES ──
function clearRoutes() {
  map.getSource('routes')?.setData(emptyFC());
  map.getSource('routes-dots')?.setData(emptyFC());
  cancelAnimationFrame(routeAnimation);
}

// ── SELECT (from list or modal) ──
function select(poi) {
  if (selectedPOI) poiMarkers[selectedPOI.id]?.el.classList.remove('selected');
  selectedPOI = poi;
  poiMarkers[poi.id]?.el.classList.add('selected');
  popup.remove();
  closeModal();

  const isDesktop = !isMobile();
  map.flyTo({
    center:[poi.lng,poi.lat], zoom:15,
    padding:{ bottom:isDesktop?0:380, right:isDesktop?360:0, top:100 },
    duration:1000,
    easing:t=>t<0.5?2*t*t:(-1+(4-2*t)*t),
    essential:true
  });

  updateDetail(poi);
  drawRoutesToPOI(poi);
  populateNearby(poi);
  expandSheet();
}

// ── DETAIL PANEL ──
function updateDetail(poi) {
  const cat = CATS[poi.catKey];
  const badge = document.getElementById('detail-badge');
  badge.innerHTML = `<span style="color:${cat.color};display:flex;width:14px;height:14px;">${cat.icon}</span>&nbsp;${cat.label.toUpperCase()}`;
  badge.style.color=cat.color; badge.style.background=`${cat.color}18`;
  document.getElementById('detail-name').textContent=poi.name;
  document.getElementById('detail-addr').textContent=poi.address||'No address available';
}

function resetDetail() {
  const badge = document.getElementById('detail-badge');
  badge.innerHTML='TAP A MARKER'; badge.style.cssText='';
  document.getElementById('detail-name').textContent='NEAR you';
  document.getElementById('detail-addr').textContent='Showing nearest per category';
}

function populateNearby(from) {
  const items = allPOI
    .filter(p=>p.id!==from.id&&activeCats.has(p.catKey))
    .map(p=>({...p, d:haversine({lng:from.lng,lat:from.lat},{lng:p.lng,lat:p.lat})}))
    .sort((a,b)=>a.d-b.d).slice(0,40);
  renderNearbyList(items, from.id);
}

function populateNearbyDefault() {
  const items = allPOI.filter(p=>activeCats.has(p.catKey)).sort((a,b)=>a.dist-b.dist).slice(0,40);
  document.getElementById('nearby-count').textContent=`${items.length} places`;
  renderNearbyList(items, null);
}

function renderNearbyList(items, fromId) {
  const list = document.getElementById('nearby-list');
  document.getElementById('nearby-count').textContent=`${items.length} places`;
  if (!items.length) {
    list.innerHTML=`<div style="padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;font-family:'Space Mono',monospace;">Nothing found</div>`;
    return;
  }
  list.innerHTML = items.map(p => {
    const cat=CATS[p.catKey], sk=safeKey(p.id);
    const isNearest = nearestPerCat[p.catKey]?.id===p.id;
    window['_p'+sk]=p;
    return `<div class="nearby-item" onclick="select(window['_p${sk}'])">
      <div class="ni-pip" style="background:${cat.color};box-shadow:0 0 8px ${cat.color}80;"></div>
      <div class="ni-info">
        <div class="ni-name">${esc(p.name)}</div>
        <div class="ni-sub">
          <span class="ni-sub-icon" style="color:${cat.color};">${cat.icon}</span>
          <span>${cat.label}</span>
          ${isNearest?`<span class="ni-nearest-badge">NEAREST</span>`:''}
        </div>
      </div>
      <div class="ni-dist">${fmt(p.d??p.dist)}</div>
    </div>`;
  }).join('');
}

// ── FILTERS ──
function buildFilters() {
  document.getElementById('filter-bar').innerHTML = Object.entries(CATS).map(([k,c]) => `
    <button class="cat-pill active" data-cat="${k}" onclick="toggleCat('${k}')">
      <div class="pill-dot" style="background:${c.color};box-shadow:0 0 8px ${c.color}80;"></div>
      <span class="pill-icon">${c.icon}</span>
      ${c.label}
      <span class="pill-cnt" id="cnt-${k}">0</span>
    </button>`).join('');
}

function toggleCat(k) {
  activeCats.has(k)?activeCats.delete(k):activeCats.add(k);
  const btn=document.querySelector(`[data-cat="${k}"]`);
  btn.classList.toggle('active',activeCats.has(k));
  btn.classList.toggle('off',!activeCats.has(k));
  refreshVis();
  if (selectedPOI) { drawRoutesToPOI(selectedPOI); populateNearby(selectedPOI); }
  else { drawInitialRoutes(); populateNearbyDefault(); fitMapToBounds(); }
}

function updateCounts() {
  Object.keys(CATS).forEach(k => {
    const el=document.getElementById('cnt-'+k);
    if (el) el.textContent=allPOI.filter(p=>p.catKey===k).length;
  });
}

function refreshVis() {
  let visiblePOI=[];
  Object.entries(poiMarkers).forEach(([id,{el,wrap}]) => {
    const poi=allPOI.find(p=>p.id===id);
    if (poi&&activeCats.has(poi.catKey)) { if(wrap)wrap.style.display='block'; visiblePOI.push(poi); }
    else { if(wrap)wrap.style.display='none'; el.classList.remove('distant'); }
  });
  visiblePOI.sort((a,b)=>a.dist-b.dist);
  visiblePOI.forEach((poi,i) => {
    const m=poiMarkers[poi.id];
    if (m) { if(i>=12)m.el.classList.add('distant'); else m.el.classList.remove('distant'); }
  });
  if (selectedPOI&&!activeCats.has(selectedPOI.catKey)) {
    clearRoutes(); resetDetail(); selectedPOI=null; drawInitialRoutes();
  }
  updateCounts();
}

// ── SHEET GESTURES ──
const sheet = document.getElementById('sheet');
const handle = document.getElementById('sheet-handle');

function expandSheet()   { sheetState='expanded'; sheet.className=''; sheet.classList.add('expanded'); }
function peekSheet()     { sheetState='peek';     sheet.className=''; sheet.classList.add('peek'); }
function collapseSheet() { sheetState='collapsed';sheet.className=''; sheet.classList.add('collapsed'); }

handle.addEventListener('click', () => {
  if (sheetState==='peek') expandSheet();
  else if (sheetState==='expanded') peekSheet();
  else peekSheet();
});

function initDrag(e) {
  touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY;
  touchStartTime=Date.now(); sheetStartY=sheet.getBoundingClientRect().top;
  isDraggingSheet=false; dragLocked=false;
}

handle.addEventListener('touchstart',initDrag,{passive:true});
document.getElementById('filter-bar').addEventListener('touchstart',initDrag,{passive:true});
document.getElementById('detail-area').addEventListener('touchstart',initDrag,{passive:true});
document.querySelector('.nearby-head').addEventListener('touchstart',initDrag,{passive:true});

document.addEventListener('touchmove', e => {
  if (touchStartY===null) return;
  const dx=e.touches[0].clientX-touchStartX, dy=e.touches[0].clientY-touchStartY;
  if (!dragLocked) {
    if (Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>10) { touchStartY=null; return; }
    else if (Math.abs(dy)>10) { dragLocked=true; isDraggingSheet=true; }
  }
  if (isDraggingSheet) {
    sheet.style.transition='none';
    const newTop=Math.max(window.innerHeight*0.15,sheetStartY+dy);
    sheet.style.transform=`translateY(${newTop-sheetStartY>0?newTop-sheetStartY:0}px)`;
  }
},{passive:true});

document.addEventListener('touchend', e => {
  if (touchStartY===null) return;
  sheet.style.transition=''; sheet.style.transform='';
  const dy=e.changedTouches[0].clientY-touchStartY;
  const velocity=Math.abs(dy)/((Date.now()-touchStartTime)||1);
  if (isDraggingSheet) {
    if (dy<-50||(dy<0&&velocity>0.8)) expandSheet();
    else if (dy>50||(dy>0&&velocity>0.8)) { if(sheetState==='expanded')peekSheet(); else collapseSheet(); }
    else { if(sheetState==='expanded')expandSheet(); else if(sheetState==='peek')peekSheet(); else collapseSheet(); }
  }
  touchStartY=null; isDraggingSheet=false; dragLocked=false;
},{passive:true});

peekSheet();

// ── SEARCH AUTOCOMPLETE ──
document.getElementById('search-input').addEventListener('input', function() {
  const q=this.value.trim();
  clearTimeout(acTimer);
  if (q.length<3){hideAC();return;}
  acTimer=setTimeout(()=>autocomplete(q),280);
});
document.getElementById('search-input').addEventListener('keydown',e=>{if(e.key==='Escape')hideAC();});
document.addEventListener('click',e=>{if(!e.target.closest('#search-wrap'))hideAC();});

async function autocomplete(q) {
  const prox=userLoc?`&proximity=${userLoc.lng},${userLoc.lat}`:'';
  const url=`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(q)}.json`
    +`?access_token=${TOKEN}&autocomplete=true&limit=6&language=en${prox}`;
  try {
    const d=await(await fetch(url)).json();
    if (!d.features?.length){hideAC();return;}
    renderAC(d.features);
  } catch {hideAC();}
}

function renderAC(fs) {
  const box=document.getElementById('ac-list');
  box.innerHTML=fs.map((f,i)=>`
    <div class="ac-item" data-i="${i}">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <div>
        <div class="ac-name">${esc(f.text)}</div>
        <div class="ac-place">${esc(f.place_name)}</div>
      </div>
    </div>`).join('');
  box.querySelectorAll('.ac-item').forEach(el=>{
    el.addEventListener('click',()=>{
      const f=fs[+el.dataset.i];
      document.getElementById('search-input').value=f.place_name;
      hideAC();
      setCenter({lng:f.center[0],lat:f.center[1]},true);
    });
  });
  box.style.display='block';
}
function hideAC(){document.getElementById('ac-list').style.display='none';}

// ── LOCATE BUTTON ──
document.getElementById('locate-btn').addEventListener('click',()=>{
  const btn=document.getElementById('locate-btn');
  btn.disabled=true; btn.classList.add('pulsing');
  geolocate();
  setTimeout(()=>{btn.disabled=false;btn.classList.remove('pulsing');},5000);
});

// ── UTILS ──
function haversine(a,b){
  const R=6371000,r=x=>x*Math.PI/180;
  const dLat=r(b.lat-a.lat),dLng=r(b.lng-a.lng);
  return 2*R*Math.asin(Math.sqrt(Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2));
}
function fmt(m){return m>=1000?(m/1000).toFixed(1)+' km':Math.round(m)+' m';}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function safeKey(id){return id.replace(/[^a-z0-9]/gi,'_');}
function emptyFC(){return{type:'FeatureCollection',features:[]};}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
function showLoading(){document.getElementById('loading').classList.remove('hidden');}
function hideLoading(){document.getElementById('loading').classList.add('hidden');}
function setLoadProgress(pct,txt){
  document.getElementById('load-bar').style.width=pct+'%';
  if(txt)document.getElementById('load-text').textContent=txt;
}

init();
setLoadProgress(20,'Loading map…');
</script>
